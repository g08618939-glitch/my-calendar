<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的万年历</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">我的历法工具</p>
        <h1>万年历</h1>
        <p class="subtitle">公历 · 农历 · 节气 · 节日 · 每日宜忌</p>
      </div>
      <button id="todayBtn" class="today-btn">回到今天</button>
    </header>

    <section class="today-card" id="todayCard"></section>

    <section class="calendar-card">
      <div class="calendar-toolbar">
        <button id="prevBtn" aria-label="上个月">‹</button>
        <h2 id="monthTitle"></h2>
        <button id="nextBtn" aria-label="下个月">›</button>
      </div>
      <div class="selects">
        <select id="yearSelect" aria-label="年份"></select>
        <select id="monthSelect" aria-label="月份"></select>
      </div>
      <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div id="calendar" class="calendar-grid"></div>
    </section>

    <section class="detail-card" id="detailCard"></section>
    <section class="info-grid"><article class="info-card"><h3>节气与物候</h3><p class="muted">天文历算 · 节气日期</p><div id="solarTerms"></div></article><article class="info-card"><h3>节日倒计时</h3><p class="muted">公历与传统节日</p><div id="festivalList"></div></article></section>
    <section class="holiday-card"><h3>2026 年放假安排</h3><p class="muted">节日假期与调休上班日期</p><div class="holiday-table" id="holidayTable"></div></section>
    <section class="links-card"><h3>快捷查询</h3><div class="quick-links"><a href="#detailCard">老黄历今日宜忌</a><a href="#calendar">农历查询</a><a href="#solarTerms">二十四节气</a><a href="#festivalList">节日倒计时</a><a href="#holidayTable">放假安排</a></div></section>
    <section class="about-card"><h3>关于万年历</h3><p>万年历把公历、农历、干支、节气、节日与放假安排汇于一页。点击任意日期即可查看日期详情，使用箭头或年月下拉框浏览其他月份。</p><p class="muted">本页面为个人 GitHub Pages 项目，历法信息仅供民俗文化参考。</p></section>

    <footer>我的万年历 · 数据仅供民俗文化参考</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
  <script src="app.js"></script>
</body>
</html>
